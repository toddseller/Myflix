name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The master ruleset requires a check named "test"; renaming this job silently drops the requirement.
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/client/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/client/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn test

      - run: yarn build

      # Steps, not jobs: the ruleset and the deploy's gate only look at this job's check.
      # deploy.yml only runs on a tag, so this is where a broken workflow gets caught.
      - name: Lint the workflows
        working-directory: .
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -no-color

      # The tests run outside Docker, so this catches an image that wouldn't build before a deploy does.
      - name: Build the image
        working-directory: .
        run: docker build ./frontend
